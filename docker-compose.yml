services:
  db:
    image: postgres:16
    container_name: coloc-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Les scripts de ce dossier sont exécutés automatiquement au PREMIER lancement
      - ./database:/docker-entrypoint-initdb.d

  # À décommenter plus tard quand le back et le front existeront
  # backend:
  #   build: ./backend
  #   depends_on: [db]
  #   ports: ["8080:8080"]
  #   environment:
  #     SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/coloc
  #     SPRING_DATASOURCE_USERNAME: coloc_user
  #     SPRING_DATASOURCE_PASSWORD: coloc_pwd
  # frontend:
  #   build: ./frontend
  #   depends_on: [backend]
  #   ports: ["4200:80"]

volumes:
  pgdata:
