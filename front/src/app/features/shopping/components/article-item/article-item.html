<input
  type="checkbox"
  class="checkbox"
  [checked]="buying()"
  [disabled]="buying() || deleting() || editing()"
  [attr.aria-label]="'Marquer « ' + article().name + ' » comme acheté'"
  (change)="buyRequested.emit(article())"
/>

@if (editing()) {
  <input
    #nameInput
    appAutoFocus
    class="name-input"
    type="text"
    maxlength="100"
    aria-label="Nouveau nom de l'article"
    [value]="article().name"
    [disabled]="saving()"
    (keydown.enter)="renameRequested.emit(nameInput.value)"
    (keydown.escape)="editCancelled.emit()"
    (blur)="renameRequested.emit(nameInput.value)"
  />
} @else {
  <span class="name">{{ article().name }}</span>
  <div class="actions">
    <button
      type="button"
      class="icon-button edit"
      title="Modifier"
      [attr.aria-label]="'Modifier « ' + article().name + ' »'"
      [disabled]="buying() || deleting()"
      (click)="editRequested.emit(article())"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 20h4L19 9l-4-4L4 16v4z" />
        <path d="M13.5 6.5l4 4" />
      </svg>
    </button>
    <button
      type="button"
      class="icon-button delete"
      title="Supprimer"
      [attr.aria-label]="'Supprimer « ' + article().name + ' »'"
      [disabled]="buying() || deleting()"
      (click)="deleteRequested.emit(article())"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6" />
      </svg>
    </button>
  </div>
}
