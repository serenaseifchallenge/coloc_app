<app-roommate-avatar class="avatar" [roommate]="roommate()" />

<div class="identity">
  <p class="name">{{ roommate().name }} {{ roommate().surname }}</p>
  <p class="title">{{ title() }}</p>
</div>

<div class="score">
  <span class="value">{{ points() }}</span>
  <span class="unit">point{{ points() > 1 ? 's' : '' }}</span>
</div>
