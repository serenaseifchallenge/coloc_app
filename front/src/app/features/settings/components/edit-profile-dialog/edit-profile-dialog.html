<app-modal heading="Editer profil" (closed)="closed.emit()">
  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    @if (error()) {
      <p class="form-alert" role="alert">{{ error() }}</p>
    }
    <div class="form-field">
      <label for="edit-email">Email</label>
      <input id="edit-email" type="email" formControlName="email" autocomplete="email" />
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <span class="form-field-error">Entrez une adresse email valide.</span>
      }
    </div>
    <div class="form-field">
      <label for="edit-password">Mot de passe</label>
      <input id="edit-password" type="password" formControlName="newPassword" placeholder="Laisser vide pour le garder" autocomplete="new-password" />
      @if (form.controls.newPassword.touched && form.controls.newPassword.invalid) {
        <span class="form-field-error">8 caractères minimum.</span>
      }
    </div>
    <div class="dialog-actions">
      <button type="submit" class="btn btn-salmon" [disabled]="saving()">Valider</button>
    </div>
  </form>
</app-modal>
