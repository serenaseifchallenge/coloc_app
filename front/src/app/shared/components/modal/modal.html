<dialog #dialog [attr.aria-labelledby]="headingId" (close)="closed.emit()" appBackdropClick (backdropClick)="close()">
  <div class="content">
    <header>
      <h2 [id]="headingId">{{ heading() }}</h2>
      <button type="button" class="close-button" aria-label="Fermer" (click)="close()">✕</button>
    </header>
    <ng-content />
  </div>
  <ng-content select="[modalAside]" />
</dialog>
